<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030504" />
    <meta name="description" content="Monster Energy Zero Sugar, Ultra Fiesta Mango e Ultra White." />
    <title>Monster Energy — Escolha sua energia</title>

    <link rel="stylesheet" href="./styles.css" />
   <link rel="shortcut icon" href="logo1.png" type="image/x-icon"> 
  </head>
  <body>
    <div class="scroll-track" id="scroll-track">
    <main class="showcase" id="showcase">
      <video
        class="hero-video"
        id="hero-video"
        src="./Video%201.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        aria-label="Apresentação em vídeo da coleção Monster Energy"
      ></video>

      <div class="edge-shading" aria-hidden="true"></div>
      <div class="media-grain" aria-hidden="true"></div>
      <div class="ambient-glow" aria-hidden="true"></div>
      <div class="particles" id="particles" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="#produto" aria-label="Monster Energy — início">
          <span class="brand-logo" aria-hidden="true"></span>
          <span>MONSTER<br /><b>ENERGY</b></span>
        </a>
        <span class="collection">ENERGY SERIES · 03 SABORES</span>
      </header>

      <section class="product-content" id="product-content" aria-labelledby="flavor-name">
        <div class="panel-index">
          <span id="current-index">01</span>
          <i aria-hidden="true"></i>
          <span>03</span>
        </div>
        <span class="eyebrow" id="flavor-eyebrow"></span>
        <h1 id="flavor-name"></h1>
        <p class="description" id="flavor-description"></p>
        <p class="detail" id="flavor-detail"></p>
      </section>

      <aside class="purchase-card" id="produto" aria-label="Comprar o sabor selecionado">
        <span class="purchase-label">Sabor selecionado</span>
        <strong class="purchase-name" id="purchase-name">Zero Sugar</strong>
        <div class="price-block">
          <small>Valor demonstrativo</small>
          <strong id="flavor-price"></strong>
        </div>
        <a class="buy-button" id="buy-button" href="./checkout.html">
          Comprar agora <span aria-hidden="true">↗</span>
        </a>
      </aside>

      <div class="flavor-navigation">
        <div class="flavor-tabs" id="flavor-tabs" role="tablist" aria-label="Selecionar sabor"></div>
        <span class="navigation-hint">Arraste o vídeo ou use ← →</span>
      </div>

      <div class="media-caption">
        <span>Monster Energy</span>
        <span id="video-status">Role para explorar</span>
      </div>

      <div class="video-progress" aria-hidden="true">
        <span id="video-progress-bar"></span>
      </div>

      <p class="sr-only" id="flavor-announcement" aria-live="polite"></p>
    </main>
    </div>

    <script src="./flavors.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
